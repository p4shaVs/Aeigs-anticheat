# Netlify — Aeigs Anti-Cheat (Next.js 14 App Router)
# Next.js runtime'ı (API route'lar, SSR, key sistemi) otomatik plugin ile çalışır.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # NOT: PRISMA_CLI_BINARY_TARGETS env'i KULLANMA — "native"i env üzerinden
  # tanımadığı için "Unknown binaryTarget native" hatası verir. Binary target
  # yalnızca prisma/schema.prisma içindeki generator bloğunda tanımlı.
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
